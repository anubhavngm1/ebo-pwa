name: Build Release APK (signed)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name (e.g. 1.0.1)
        required: false
        default: "1.0.0"

jobs:
  release:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 — skipping signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Inject google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" > app/google-services.json
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ebo-stay-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
