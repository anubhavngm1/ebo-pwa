plugins {
    id 'com.android.application'
}

// Apply Google Services only when a real google-services.json exists
def gs = file('google-services.json')
def hasFirebase = gs.exists() && !gs.getText('UTF-8').contains('ebo-stay-placeholder')
if (hasFirebase) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.ebostay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ebostay.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep same applicationId as release so App Links (assetlinks) work
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}
